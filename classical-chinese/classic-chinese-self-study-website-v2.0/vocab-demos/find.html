<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点字 · 字词练习 demo</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../practice.css">
</head>
<body>
<div class="vmain">
  <h1>点字</h1>
  <p class="sub">没有选项，也没有加点。只告诉你这句里有一个“名词作动词”之类的字，你自己把它点出来。更接近真题里“找出句中的……”那一类问法。</p>
  <div class="pillrow" id="modes">
    <button data-m="use" class="on">活用 · 通假</button><button data-m="xu">虚词</button>
  </div>
  <div class="ctl">
    <label>范围 <select id="scope"></select></label>
    <span id="cnt" class="hint"></span>
    <span class="sp"></span>
    <button class="primary" id="go">重新出题</button>
  </div>
  <div id="stage"></div>
  <p class="hint">说明：一句里可能不止一处符合，这里只认词语表里标的那一处；点错了会告诉你答案是哪个字。</p>
</div>
<script src="../data/jx1.js"></script><script src="../data/jx2.js"></script><script src="../data/jx3.js"></script><script src="../data/jx4.js"></script><script src="../data/jx5.js"></script>
<script src="../data/unit1.js"></script><script src="../data/unit2.js"></script><script src="../data/unit3.js"></script><script src="../data/unit4.js"></script><script src="../data/unit5.js"></script>
<script src="../practice.js"></script>
<script>
V.chrome("find.html");
const $ = s => document.querySelector(s), e = V.esc;
const PUNC = /[，。！？；：、“”‘’（）《》\s]/;
let mode = "use", qs = [], i = 0, score = 0, miss = [], done = false;
const scope = V.scopeBox($("#scope"), start);
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x === b)); start();
});
function start() {
  const p = V.usagePool(mode, scope()).filter(x => x.len <= 3);       // 太长的短语不适合“点一个字”
  $("#cnt").textContent = "这个范围共 " + p.length + " 句可出";
  qs = V.balanced(p, 8); i = 0; score = 0; miss = []; show();
}
function show() {
  const st = $("#stage");
  if (!qs.length) { st.innerHTML = '<div class="card">这个范围里没有可出的题，换个范围试试。</div>'; return; }
  if (i >= qs.length) { finish(); return; }
  const q = qs[i]; done = false;
  const ask = mode === "use" ? '这句里有一个“<b>' + e(q.cat) + '</b>”的字，把它点出来：' : '点出句中的“<b>' + e(q.cat) + '</b>”：';
  const chars = [...q.raw].map((c, k) => PUNC.test(c) ? '<span class="punc">' + e(c) + '</span>' : '<button class="ch" data-k="' + k + '">' + e(c) + '</button>').join("");
  st.innerHTML = '<div class="qcard"><div class="qmeta"><span>第 ' + (i + 1) + ' / ' + qs.length + ' 题</span><span>《' + e(q.src) + '》</span></div>' +
    '<div class="vbar"><i style="width:' + Math.round(100 * i / qs.length) + '%"></i></div>' +
    '<div class="qask">' + ask + '</div><div class="chs">' + chars + '</div><div class="qrev" hidden></div>' +
    '<div class="row"><button class="next primary" hidden>' + (i + 1 < qs.length ? "下一题 →" : "看结果") + '</button></div></div>';
  const btns = [...st.querySelectorAll(".ch")];
  btns.forEach(b => b.onclick = () => {
    if (done) return; done = true;
    const k = +b.dataset.k, hit = k >= q.start && k < q.start + q.len;
    btns.forEach(x => { const kk = +x.dataset.k; x.disabled = true; if (kk >= q.start && kk < q.start + q.len) x.classList.add(hit ? "ok" : "tgt"); });
    if (!hit) b.classList.add("bad");
    hit ? score++ : miss.push(q);
    const rv = st.querySelector(".qrev");
    rv.innerHTML = '<span class="verdict ' + (hit ? "yes" : "no") + '">' + (hit ? "✓ 找对了" : "✗ 答案是黄色的字") + '</span><b>' + e(q.w) + '</b>' + e(q.full);
    rv.hidden = false; const nx = st.querySelector(".next"); nx.hidden = false; nx.focus({ preventScroll: true });
    nx.onclick = () => { i++; show(); };
  });
}
function finish() {
  $("#stage").innerHTML = '<div class="qcard"><div class="score"><span class="big">' + score + ' / ' + qs.length + '</span><span>' + (miss.length ? "没找到的几句，再看一遍：" : "全部找对！") + '</span></div>' +
    miss.map(q => '<div class="wq"><div class="qctx sm">' + q.ctx + '</div><div class="qrev"><b>' + e(q.w) + '</b>' + e(q.full) + '</div></div>').join("") +
    '<div class="row"><button class="primary" id="again">再来一轮</button></div></div>';
  $("#again").onclick = start;
}
$("#go").onclick = start; start();
</script>
</body>
</html>
