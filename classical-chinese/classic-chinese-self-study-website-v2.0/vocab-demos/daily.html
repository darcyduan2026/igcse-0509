<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日一练 · 字词练习 demo</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../practice.css">
</head>
<body>
<div class="vmain">
  <h1>每日一练</h1>
  <p class="sub">每天 10 题：5 道语境选义、2 道活用·通假、2 道虚词、1 道句式。题目由日期决定，<b>同一天所有人打开看到的是同一套题</b>，课堂上可以直接说“做今天的每日一练”。</p>
  <div class="card">
    <div class="streak">
      <div><span class="big" id="st">0</span> 天<div class="hint">连续打卡</div></div>
      <div><div class="days" id="days"></div><div class="hint" id="dn">最近 14 天（红色 = 当天做完了）</div></div>
    </div>
  </div>
  <div id="stage"></div>
</div>
<script src="../data/jx1.js"></script><script src="../data/jx2.js"></script><script src="../data/jx3.js"></script><script src="../data/jx4.js"></script><script src="../data/jx5.js"></script>
<script src="../data/unit1.js"></script><script src="../data/unit2.js"></script><script src="../data/unit3.js"></script><script src="../data/unit4.js"></script><script src="../data/unit5.js"></script>
<script src="../practice.js"></script>
<script>
V.chrome("daily.html");
const $ = s => document.querySelector(s);
V.store.daily = V.store.daily || {};
const key = V.dayKey();

function compose() {
  return V.seeded("caiwen-daily-" + key, () => {
    const bank = V.items.filter(x => !x.long), qs = [];
    V.sample(bank, 5).forEach(x => { const q = V.meaningQuestion(x, bank); if (q) qs.push(q); });
    V.sample(V.usage.use, 2).forEach(x => { const q = V.usageQuestion("use", x); if (q) qs.push(q); });
    V.balanced(V.usage.xu, 2).forEach(x => { const q = V.usageQuestion("xu", x); if (q) qs.push(q); });
    V.sample(V.usage.ju, 1).forEach(x => { const q = V.usageQuestion("ju", x); if (q) qs.push(q); });
    return V.shuffle(qs);
  });
}
function streak() {
  let n = 0, d = new Date();
  if (!V.store.daily[V.dayKey(d)]) d.setDate(d.getDate() - 1);       // 今天还没做，不算断，从昨天往前数
  while (V.store.daily[V.dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function drawHead() {
  $("#st").textContent = streak();
  let h = "";
  for (let k = 13; k >= 0; k--) {
    const d = new Date(); d.setDate(d.getDate() - k);
    const kk = V.dayKey(d), r = V.store.daily[kk];
    h += '<i class="' + (r ? "on" : "") + (k === 0 ? " today" : "") + '" title="' + kk + (r ? "：" + r.best + "/" + r.n : "") + '"></i>';
  }
  $("#days").innerHTML = h;
  const t = V.store.daily[key];
  $("#dn").textContent = t ? "今天已完成，最好成绩 " + t.best + " / " + t.n + "。再做一遍不影响连胜。" : "最近 14 天（红色 = 当天做完了）";
}
function start() {
  const qs = compose();
  V.runQuiz($("#stage"), qs, {
    onAnswer: (q, ok) => { if (!ok && V.byId[q.id]) { V.store.wrong[q.id] = (V.store.wrong[q.id] || 0) + 1; V.save(); } },
    onFinish: (score, n) => {
      const r = V.store.daily[key];
      V.store.daily[key] = { best: Math.max(score, r ? r.best : 0), n }; V.save(); drawHead();
    },
    actions: [{ label: "再做一遍", fn: start }]
  });
}
drawHead(); start();
</script>
</body>
</html>
