<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用法辨析 · 字词练习 demo</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../practice.css">
</head>
<body>
<div class="vmain">
  <h1>用法辨析</h1>
  <p class="sub">不问“是什么意思”，问“是哪种用法”。这一类题正好对应 0509 常考的词类活用、通假、虚词和句式。题源是各篇词语表里已经标好的类型。</p>
  <div class="pillrow" id="modes">
    <button data-m="use" class="on">活用 · 通假</button><button data-m="xu">虚词</button><button data-m="ju">特殊句式</button>
  </div>
  <div class="ctl">
    <label>范围 <select id="scope"></select></label>
    <span id="cnt" class="hint"></span>
    <span class="sp"></span>
    <button class="primary" id="go">重新出题</button>
  </div>
  <div id="stage"></div>
</div>
<script src="../data/jx1.js"></script><script src="../data/jx2.js"></script><script src="../data/jx3.js"></script><script src="../data/jx4.js"></script><script src="../data/jx5.js"></script>
<script src="../data/unit1.js"></script><script src="../data/unit2.js"></script><script src="../data/unit3.js"></script><script src="../data/unit4.js"></script><script src="../data/unit5.js"></script>
<script src="../practice.js"></script>
<script>
V.chrome("usage.html");
const $ = s => document.querySelector(s);
let mode = "use";
const scope = V.scopeBox($("#scope"), start);
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x === b));
  start();
});
function start() {
  const pool = V.usagePool(mode, scope());
  $("#cnt").textContent = "这个范围共 " + pool.length + " 道可出";
  const qs = V.balanced(pool, 10).map(x => V.usageQuestion(mode, x)).filter(Boolean);
  V.runQuiz($("#stage"), qs, { actions: [{ label: "再来一轮", fn: start }] });
}
$("#go").onclick = start; start();
</script>
</body>
</html>
