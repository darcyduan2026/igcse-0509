<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配对 · 字词练习 demo</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../practice.css">
</head>
<body>
<div class="vmain">
  <h1>配对</h1>
  <p class="sub">左边点一个字词，右边点它的意思，配对成功就变绿。选中字词后，下面会显示它在原文里的句子，卡住时可以看句子找线索。</p>
  <div class="ctl">
    <label>范围 <select id="scope"></select></label>
    <label>每组 <select id="n"><option>6</option><option>8</option><option>4</option></select> 对</label>
    <span class="sp"></span>
    <button class="primary" id="go">换一组</button>
  </div>
  <div class="mhead"><span>用时 <b id="tm">0</b> 秒</span><span>失误 <b id="er">0</b></span><span>已配 <b id="dn">0</b> / <span id="tt">0</span></span><span id="best"></span></div>
  <div class="mgrid"><div class="mcol" id="L"></div><div class="mcol" id="R"></div></div>
  <div class="mctx" id="ctx">先点左边的字词。</div>
  <div id="res"></div>
</div>
<script src="../data/jx1.js"></script><script src="../data/jx2.js"></script><script src="../data/jx3.js"></script><script src="../data/jx4.js"></script><script src="../data/jx5.js"></script>
<script src="../data/unit1.js"></script><script src="../data/unit2.js"></script><script src="../data/unit3.js"></script><script src="../data/unit4.js"></script><script src="../data/unit5.js"></script>
<script src="../practice.js"></script>
<script>
V.chrome("match.html");
const $ = s => document.querySelector(s);
const scope = V.scopeBox($("#scope"), start);
let pairs = [], selL = null, selR = null, done = 0, err = 0, t0 = 0, timer = null;

function pick(n) {
  const pool = V.shuffle(V.items.filter(x => !x.long && x.core.length <= 10 && V.inScope(x, scope())));
  const w = new Set(), m = new Set(), out = [];
  for (const x of pool) { if (out.length >= n) break; if (w.has(x.w) || m.has(x.core)) continue; w.add(x.w); m.add(x.core); out.push(x); }
  return out;
}
function start() {
  clearInterval(timer);
  pairs = pick(+$("#n").value); selL = selR = null; done = 0; err = 0; $("#res").innerHTML = "";
  if (pairs.length < 3) { $("#L").innerHTML = $("#R").innerHTML = ""; $("#res").innerHTML = '<div class="card">这个范围里的字词太少，凑不成一组，换个范围试试。</div>'; return; }
  const e = V.esc;
  $("#L").innerHTML = V.shuffle(pairs).map(x => '<button class="mcell wd" data-id="' + x.id + '">' + e(x.w) + (x.py ? '<small>' + e(x.py) + '</small>' : '') + '</button>').join("");
  $("#R").innerHTML = V.shuffle(pairs).map(x => '<button class="mcell" data-id="' + x.id + '">' + e(x.core) + '</button>').join("");
  $("#L").querySelectorAll("button").forEach(b => b.onclick = () => choose("L", b));
  $("#R").querySelectorAll("button").forEach(b => b.onclick = () => choose("R", b));
  $("#tt").textContent = pairs.length; $("#dn").textContent = 0; $("#er").textContent = 0; $("#tm").textContent = 0;
  $("#ctx").textContent = "先点左边的字词。";
  const b = V.store.best["match" + pairs.length]; $("#best").textContent = b ? "这个组数的最快纪录：" + b + " 秒" : "";
  t0 = 0;
}
function choose(side, b) {
  if (b.classList.contains("done")) return;
  if (!t0) { t0 = Date.now(); timer = setInterval(() => { $("#tm").textContent = Math.floor((Date.now() - t0) / 1000); }, 500); }
  const col = side === "L" ? "#L" : "#R";
  document.querySelectorAll(col + " .sel").forEach(x => x.classList.remove("sel"));
  b.classList.add("sel");
  if (side === "L") { selL = b; const x = V.byId[b.dataset.id]; $("#ctx").innerHTML = V.html(x) + '　<small>《' + V.esc(x.src) + '》</small>'; } else selR = b;
  if (!selL || !selR) return;
  const L = selL, R = selR; selL = selR = null;
  if (L.dataset.id === R.dataset.id) {
    [L, R].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); }); done++; $("#dn").textContent = done;
    const x = V.byId[L.dataset.id]; $("#ctx").innerHTML = V.html(x) + '　<small>' + V.esc(x.note) + '</small>';
    if (done === pairs.length) finish();
  } else {
    err++; $("#er").textContent = err;
    [L, R].forEach(x => { x.classList.remove("sel"); x.classList.add("shake"); setTimeout(() => x.classList.remove("shake"), 350); });
  }
}
function finish() {
  clearInterval(timer);
  const s = Math.max(1, Math.round((Date.now() - t0) / 1000)), key = "match" + pairs.length;
  const nb = !V.store.best[key] || s < V.store.best[key]; if (nb) { V.store.best[key] = s; V.save(); }
  $("#res").innerHTML = '<div class="qcard"><div class="score"><span class="big">' + s + ' 秒</span><span>失误 ' + err + ' 次' + (nb ? '，刷新了纪录！' : '') + '</span></div><div class="row"><button class="primary" id="nx">再来一组</button></div></div>';
  $("#nx").onclick = start; $("#best").textContent = "这个组数的最快纪录：" + V.store.best[key] + " 秒";
}
$("#go").onclick = start; $("#n").onchange = start;
start();
</script>
</body>
</html>
