<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>归类 · 字词练习 demo</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../practice.css">
</head>
<body>
<div class="vmain">
  <h1>归类</h1>
  <p class="sub">上面是一堆原文句子，下面是几个“篮子”。先点一张句子卡，再点它该进的篮子。放对的留在篮子里，还能对照同一个篮子里的句子找规律；放错的会抖一下。</p>
  <div class="pillrow" id="modes">
    <button data-m="zhi" class="on">“之”：代词还是助词</button><button data-m="mix">各种虚词混合</button>
  </div>
  <div class="ctl">
    <label>范围 <select id="scope"></select></label>
    <span id="cnt" class="hint"></span>
    <span class="sp"></span>
    <button class="primary" id="go">换一组</button>
  </div>
  <div class="tip" id="tip"></div>
  <div class="tray" id="tray"></div>
  <div class="sortgrid" id="grid"></div>
  <div id="res"></div>
</div>
<script src="../data/jx1.js"></script><script src="../data/jx2.js"></script><script src="../data/jx3.js"></script><script src="../data/jx4.js"></script><script src="../data/jx5.js"></script>
<script src="../data/unit1.js"></script><script src="../data/unit2.js"></script><script src="../data/unit3.js"></script><script src="../data/unit4.js"></script><script src="../data/unit5.js"></script>
<script src="../practice.js"></script>
<script>
V.chrome("sort.html");
const $ = s => document.querySelector(s), e = V.esc;
const BUCKETS = {
  zhi: [["代词", "指代人或事物，能换成“他/她/它”"], ["结构助词", "放在两个词之间，能换成“的”"]],
  mix: [["代词", "之、其、吾、汝……"], ["结构助词", "的、定语标志"], ["语气词", "句末或句中的语气"], ["连词", "而、虽、况、苟……"], ["介词", "以、为……"]]
};
const TIPS = {
  zhi: "小技巧：把“之”换成“他／它”读一遍，读得通就是代词（动词后面的“之”多是这样）；夹在两个名词之间、能换成“的”，就是结构助词。",
  mix: "这一组把几种虚词混在一起，先想“这个字在句子里起什么作用”：指代、连接、表示语气，还是引出对象。"
};
let mode = "zhi", cards = [], sel = null, err = 0;
const scope = V.scopeBox($("#scope"), start);
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x === b)); start();
});
function pool() {
  const names = BUCKETS[mode].map(b => b[0]);
  return V.usagePool("xu", scope()).filter(x => names.includes(x.cat) && (mode === "mix" || x.w === "之"));
}
function start() {
  const p = pool(); $("#cnt").textContent = "这个范围共 " + p.length + " 张可用";
  cards = V.balanced(p, mode === "zhi" ? 8 : 10); sel = null; err = 0; $("#res").innerHTML = "";
  $("#tip").textContent = TIPS[mode];
  const bs = BUCKETS[mode];
  $("#grid").style.gridTemplateColumns = "repeat(" + bs.length + ",minmax(0,1fr))";
  $("#grid").innerHTML = bs.map(b => '<div class="bucket" data-c="' + e(b[0]) + '"><button class="bhd">' + e(b[0]) + '<small>' + e(b[1]) + '</small></button><div class="blist"></div></div>').join("");
  $("#tray").innerHTML = cards.map(x => '<button class="scard" data-id="' + x.id + '">' + x.ctx + '</button>').join("");
  if (!cards.length) $("#tray").innerHTML = '<div class="card">这个范围里没有可用的句子，换个范围试试。</div>';
  $("#tray").querySelectorAll(".scard").forEach(b => b.onclick = () => {
    $("#tray").querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b;
  });
  $("#grid").querySelectorAll(".bucket").forEach(bk => bk.querySelector(".bhd").onclick = () => place(bk));
}
function place(bk) {
  if (!sel) { $("#tip").textContent = "先点上面的一张句子卡，再点篮子。"; return; }
  const x = cards.find(c => c.id === sel.dataset.id), b = sel;
  if (x.cat === bk.dataset.c) {
    const d = document.createElement("div"); d.className = "placed"; d.innerHTML = x.ctx + '<small>' + e(x.full) + '</small>';
    bk.querySelector(".blist").appendChild(d); b.remove(); sel = null;
    if (!$("#tray").children.length) finish();
  } else {
    err++; b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 350);
    $("#tip").textContent = "再想想：这个字在句子里是什么作用？";
  }
}
function finish() {
  $("#tip").textContent = TIPS[mode];
  $("#res").innerHTML = '<div class="qcard"><div class="score"><span class="big">' + (err ? "错 " + err + " 次" : "一次全对") + '</span><span>' + cards.length + ' 张句子都归好了。看看同一个篮子里的句子，有什么共同点？</span></div><div class="row"><button class="primary" id="nx">再来一组</button></div></div>';
  $("#nx").onclick = start;
}
$("#go").onclick = start; start();
</script>
</body>
</html>
