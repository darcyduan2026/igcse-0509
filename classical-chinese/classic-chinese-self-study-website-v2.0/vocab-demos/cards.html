<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字卡 · 字词练习 demo</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../practice.css">
</head>
<body>
<div class="vmain">
  <h1>字卡</h1>
  <p class="sub">先看字和例句，在心里说出意思，再翻面核对，然后诚实地选“记得／模糊／不记得”。系统按间隔重复安排下次出现的时间：记得的隔得越来越久，不记得的当天再来。</p>
  <div class="ctl">
    <label>范围 <select id="scope"></select></label>
    <label>每次新词 <select id="n"><option>10</option><option>20</option><option>5</option></select></label>
    <label>正面 <select id="mode"><option value="fwd">字 + 例句</option><option value="rev">释义（反向回忆）</option></select></label>
    <span class="sp"></span>
    <button class="primary" id="go">开始今天的卡</button>
  </div>
  <div class="deck" id="deck"></div>
  <div id="stage"></div>
</div>
<script src="../data/jx1.js"></script><script src="../data/jx2.js"></script><script src="../data/jx3.js"></script><script src="../data/jx4.js"></script><script src="../data/jx5.js"></script>
<script src="../data/unit1.js"></script><script src="../data/unit2.js"></script><script src="../data/unit3.js"></script><script src="../data/unit4.js"></script><script src="../data/unit5.js"></script>
<script src="../practice.js"></script>
<script>
V.chrome("cards.html");
const $ = s => document.querySelector(s);
const INT = [0, 1, 3, 7, 14];                       // 各“盒子”的复习间隔（天）
const scope = V.scopeBox($("#scope"), () => { drawDeck(); start(); });
let queue = [], idx = 0, flipped = false, tally = { yes: 0, mid: 0, no: 0 };

function drawDeck() {
  const t = V.today(), its = V.items.filter(x => V.inScope(x, scope()));
  let n0 = 0, n1 = 0, n2 = 0, due = 0;
  its.forEach(x => { const c = V.store.cards[x.id]; if (!c) n0++; else { c.box >= 3 ? n2++ : n1++; if (c.due <= t) due++; } });
  const p = k => (100 * k / (its.length || 1)).toFixed(1) + "%";
  $("#deck").innerHTML = '<span>共 <b>' + its.length + '</b> 张</span><span>没学过 <b>' + n0 + '</b></span><span>学习中 <b>' + n1 + '</b></span><span>已掌握 <b>' + n2 + '</b></span><span>今天到期 <b>' + due + '</b></span>' +
    '<span class="meter"><i class="m2" style="width:' + p(n2) + '"></i><i class="m1" style="width:' + p(n1) + '"></i><i class="m0" style="width:' + p(n0) + '"></i></span>';
}
function start() {
  const t = V.today(), its = V.items.filter(x => V.inScope(x, scope()));
  const due = its.filter(x => V.store.cards[x.id] && V.store.cards[x.id].due <= t);
  const fresh = V.sample(its.filter(x => !V.store.cards[x.id]), +$("#n").value);
  queue = V.shuffle(due.concat(fresh)).map(x => x.id); idx = 0; flipped = false; tally = { yes: 0, mid: 0, no: 0 };
  draw();
}
function draw() {
  const st = $("#stage");
  if (idx >= queue.length) {
    st.innerHTML = queue.length
      ? '<div class="qcard"><div class="score"><span class="big">' + queue.length + '</span><span>张卡练完了：记得 ' + tally.yes + ' · 模糊 ' + tally.mid + ' · 不记得 ' + tally.no + '。<br>不记得的明天还会再出现。</span></div><div class="row"><button class="primary" id="again">再学一组新词</button></div></div>'
      : '<div class="card">今天这个范围没有要复习的卡，也没有新词了。换个范围，或者明天再来。</div>';
    const a = $("#again"); if (a) a.onclick = start;
    drawDeck(); return;
  }
  const x = V.byId[queue[idx]], rev = $("#mode").value === "rev", e = V.esc;
  const front = rev
    ? '<div class="mean" style="font-size:1.8em">' + e(x.core || x.note) + '</div><div class="note">这是哪个字词？</div><div class="src">《' + e(x.src) + '》</div>'
    : '<div class="big">' + e(x.w) + '</div><div class="sent">' + V.html(x) + '</div>';
  const back = rev
    ? '<div class="big sm">' + e(x.w) + '</div><div class="py">' + e(x.py) + '</div><div class="sent">' + V.html(x) + '</div><div class="note">' + e(x.note) + '</div>'
    : '<div class="big sm">' + e(x.w) + '</div><div class="py">' + e(x.py) + '</div><div class="mean"><b>' + e(x.core || x.note) + '</b></div>' + (x.note !== x.core ? '<div class="note">' + e(x.note) + '</div>' : '') + '<div class="src">《' + e(x.src) + '》</div>';
  st.innerHTML =
    '<div class="qmeta"><span>第 ' + (idx + 1) + ' / ' + queue.length + ' 张</span><span>空格翻面 · 1 不记得 · 2 模糊 · 3 记得</span></div>' +
    '<div class="flip' + (flipped ? ' on' : '') + '" id="flip"><div class="in">' +
      '<div class="face front">' + front + '<span class="tap">点一下翻面</span></div>' +
      '<div class="face back">' + back + '</div></div></div>' +
    '<div class="grade" style="visibility:' + (flipped ? 'visible' : 'hidden') + '">' +
      '<button class="g-no" data-g="no">不记得<small>当天再来</small></button>' +
      '<button class="g-mid" data-g="mid">模糊<small>明天再来</small></button>' +
      '<button class="g-yes" data-g="yes">记得<small>隔更久再来</small></button></div>';
  $("#flip").onclick = flip;
  st.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grade(b.dataset.g));
}
function flip() {
  if (!$("#flip")) return;
  flipped = !flipped; $("#flip").classList.toggle("on", flipped);
  document.querySelector(".grade").style.visibility = flipped ? "visible" : "hidden";
}
function grade(g) {
  if (!flipped || idx >= queue.length) return;
  const id = queue[idx], t = V.today(), c = V.store.cards[id] || { box: 0, due: t };
  if (g === "yes") { c.box = Math.min(c.box + 1, 4); c.due = t + INT[c.box]; }
  else if (g === "mid") { c.box = Math.max(c.box, 1); c.due = t + 1; }
  else { c.box = 0; c.due = t; if (queue.filter(q => q === id).length < 3) queue.push(id); }   // 不记得：本轮结束前再出现一次
  V.store.cards[id] = c; V.save(); tally[g]++; idx++; flipped = false; drawDeck(); draw();
}
document.addEventListener("keydown", e => {
  if (/SELECT|INPUT/.test(e.target.tagName) || e.metaKey || e.ctrlKey) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "1") grade("no"); else if (e.key === "2") grade("mid"); else if (e.key === "3") grade("yes");
});
$("#go").onclick = start; $("#mode").onchange = draw; $("#n").onchange = start;
drawDeck(); start();
</script>
</body>
</html>
