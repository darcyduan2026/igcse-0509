<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打印小测 · 字词练习 demo</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../practice.css">
</head>
<body>
<div class="vmain">
  <h1 class="np">打印小测</h1>
  <p class="sub np">给课堂用的一页纸小测：选范围、选题型，点“生成”，再点“打印”。每次生成的题都不一样；答案另起一页，只发学生页时只打印第 1 页即可。</p>
  <div class="ctl np">
    <label>范围 <select id="scope"></select></label>
    <label>选择题 <select id="n1"><option>0</option><option>5</option><option>8</option><option selected>10</option><option>15</option></select></label>
    <label>解释加点字 <select id="n2"><option>0</option><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label>
    <label>配对 <select id="n3"><option>0</option><option>4</option><option selected>6</option></select> 对</label>
    <label><input type="checkbox" id="ak" checked> 含答案页</label>
    <span class="sp"></span>
    <button class="primary" id="go">生成一套</button>
    <button id="pr">打印</button>
  </div>
  <div id="paper" class="paper"></div>
</div>
<script src="../data/jx1.js"></script><script src="../data/jx2.js"></script><script src="../data/jx3.js"></script><script src="../data/jx4.js"></script><script src="../data/jx5.js"></script>
<script src="../data/unit1.js"></script><script src="../data/unit2.js"></script><script src="../data/unit3.js"></script><script src="../data/unit4.js"></script><script src="../data/unit5.js"></script>
<script src="../practice.js"></script>
<script>
V.chrome("print.html");
const $ = s => document.querySelector(s), e = V.esc;
const L = "ABCDEF";                                  // 选择题只用前四个，配对最多六个
const scope = V.scopeBox($("#scope"), make);
const bank = V.items.filter(x => !x.long);

function pickMatch(n, avoid) {
  const w = new Set(), m = new Set(), out = [];
  for (const x of V.shuffle(bank.filter(x => !avoid.has(x.id) && x.core.length <= 10 && V.inScope(x, scope())))) {
    if (out.length >= n) break; if (w.has(x.w) || m.has(x.core)) continue; w.add(x.w); m.add(x.core); out.push(x);
  }
  return out;
}
function make() {
  const n1 = +$("#n1").value, n2 = +$("#n2").value, n3 = +$("#n3").value;
  const pool = V.shuffle(bank.filter(x => V.inScope(x, scope())));
  const mc = pool.slice(0, n1).map(x => V.meaningQuestion(x, bank)).filter(Boolean);
  const ex = pool.slice(n1, n1 + n2);
  const used = new Set([...mc.map(q => q.id), ...ex.map(x => x.id)]);
  const mt = pickMatch(n3, used), right = V.shuffle(mt);
  const sel = $("#scope"), label = sel.options[sel.selectedIndex].text.replace(/[　└\s]+/g, " ").trim();
  const total = mc.length + ex.length + mt.length;
  let h = '<div class="ptitle">文言字词小测</div><div class="pmeta"><span>范围：' + e(label) + '</span><span>姓名：________　班级：______　得分：____ / ' + total + '</span></div>';
  let sec = 0; const num = ["一", "二", "三"];
  if (mc.length) {
    h += '<h2>' + num[sec++] + '、选择：选出加点字词在句中的意思（每题 1 分）</h2>' + mc.map((q, i) =>
      '<div class="pq"><div>' + (i + 1) + '. ' + q.ctx + '　（加点字：“' + e(V.byId[q.id].w) + '”）</div><div class="po">' +
      q.options.map((o, k) => '<span>' + L[k] + '. ' + e(o.t) + '</span>').join("") + '</div></div>').join("");
  }
  if (ex.length) {
    h += '<h2>' + num[sec++] + '、解释加点字词在句中的意思（每题 1 分）</h2>' + ex.map((x, i) =>
      '<div class="pq">' + (i + 1) + '. ' + V.html(x) + '　“' + e(x.w) + '”：<span class="line"></span></div>').join("");
  }
  if (mt.length) {
    h += '<h2>' + num[sec++] + '、配对：把左边的字词和右边的意思连起来，在括号里填字母（每对 1 分）</h2><div class="pm"><div>' +
      mt.map((x, i) => '<div>' + (i + 1) + '. ' + e(x.w) + '（　　）</div>').join("") + '</div><div>' +
      right.map((x, i) => '<div>' + L[i] + '. ' + e(x.core) + '</div>').join("") + '</div></div>';
  }
  if (!total) h += '<p>这个范围里没有可出的题，换个范围，或把题数调大。</p>';
  if ($("#ak").checked && total) {
    sec = 0;
    h += '<div class="pb"></div><div class="ptitle">参考答案</div><div class="pmeta"><span>范围：' + e(label) + '</span><span>共 ' + total + ' 分</span></div><div class="ak">';
    if (mc.length) h += '<h2>' + num[sec++] + '、选择</h2><div>' + mc.map((q, i) => (i + 1) + '. ' + L[q.options.findIndex(o => o.ok)]).join("　") + '</div>' +
      mc.map((q, i) => '<div>' + (i + 1) + '. ' + q.reveal.replace(/<[^>]+>/g, " ") + '</div>').join("");
    if (ex.length) h += '<h2>' + num[sec++] + '、解释加点字词</h2>' + ex.map((x, i) => '<div>' + (i + 1) + '. ' + e(x.w) + '：' + e(x.note) + '</div>').join("");
    if (mt.length) h += '<h2>' + num[sec++] + '、配对</h2><div>' + mt.map((x, i) => (i + 1) + '—' + L[right.indexOf(x)]).join("　") + '</div>';
    h += '</div>';
  }
  $("#paper").innerHTML = h;
}
["n1", "n2", "n3", "ak"].forEach(id => $("#" + id).onchange = make);
$("#go").onclick = make; $("#pr").onclick = () => window.print();
make();
</script>
</body>
</html>
