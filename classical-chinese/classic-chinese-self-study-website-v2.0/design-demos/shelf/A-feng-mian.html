<!doctype html>
<html lang="zh-CN" data-theme="indigo" data-font="kai">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 A · 线装封面</title>
<style>
:root{
  --paper:#ebe5d4; --paper2:#f3ecda; --ink:#1a1c20; --mute:#6c6a60; --seal:#a8322a;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","BiauKai",serif;
  --song:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --ft:var(--kai); --fb:var(--kai);
  --pat:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><path d='M4 4H24V24H8V12H16V16' fill='none' stroke='white' stroke-opacity='.10' stroke-width='1.6'/></svg>");
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
[data-font="mix"]{--ft:var(--song);--fb:var(--sans)}
[data-theme="indigo"]{--c1:#24405f;--c2:#2d4f6d;--thread:#efe3bb}
[data-theme="current"]{--c1:#a5382c;--c2:#25272a;--thread:#e8d8a6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--noise),var(--paper);background-blend-mode:multiply;color:var(--ink);font-family:var(--fb);min-height:100vh}
a{color:inherit;text-decoration:none}

.top{display:flex;align-items:center;gap:18px;padding:22px 44px 0;flex-wrap:wrap}
.seal{width:58px;height:58px;background:var(--seal);color:#f7ece6;display:grid;place-items:center;font:700 20px/1.1 var(--ft);text-align:center;border-radius:3px}
.top h1{margin:0;font:900 38px/1 var(--ft);letter-spacing:.2em}
.top p{margin:4px 0 0;color:var(--mute);font-size:15px}
.top .go{margin-left:auto;font:700 18px var(--ft);border-bottom:2px solid var(--seal);padding-bottom:2px}
.top .go small{display:block;font:400 13px var(--fb);color:var(--mute);border:0}

.desk{display:flex;gap:min(9vw,120px);justify-content:center;align-items:flex-start;padding:34px 24px 80px;flex-wrap:wrap}
.book{width:372px;--tilt:-1.1deg;transform:rotate(var(--tilt));transform-origin:50% 100%}
.book.b2{--tilt:.9deg;margin-top:16px}

/* ---- 封面：靛蓝布面线装，订口在右 ---- */
.cover{display:block;position:relative;height:528px;border-radius:2px 5px 5px 2px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.0) 86%,rgba(0,0,0,.30) 94%,rgba(255,255,255,.10) 95.4%,rgba(0,0,0,.18) 100%),
    var(--pat),
    var(--noise),
    repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),
    linear-gradient(105deg,rgba(255,255,255,.07),rgba(0,0,0,.20)),var(--cv);
  background-blend-mode:normal,normal,multiply,normal,normal,normal,normal;
  box-shadow:-2px 2px 0 #e7dcc0,-4px 4px 0 #f2e9d1,-6px 6px 0 #e2d6b8,-8px 8px 0 #efe5cb,0 26px 34px -14px rgba(35,28,16,.55);
  transition:transform .25s ease, box-shadow .25s ease}
.b1 .cover{--cv:var(--c1)} .b2 .cover{--cv:var(--c2)}
.cover:hover{transform:translateY(-8px) rotate(calc(var(--tilt) * -.6))}
.cover:focus-visible{outline:3px solid var(--seal);outline-offset:4px}
.cover svg.stitch{position:absolute;right:14px;top:0;height:100%;width:44px}
.cover .corner{position:absolute;right:0;width:62px;height:62px;background:linear-gradient(135deg,#e2c477,#c79a3f);opacity:.95}
.cover .corner.t{top:0;clip-path:polygon(0 0,100% 0,100% 100%);border-radius:0 5px 0 0}
.cover .corner.b{bottom:0;clip-path:polygon(100% 0,100% 100%,0 100%);border-radius:0 0 5px 0}
.slip{position:absolute;left:38px;top:42px;width:98px;height:262px;background:var(--paper2);display:flex;flex-direction:row-reverse;justify-content:center;gap:8px;padding:20px 8px;
  box-shadow:inset 0 0 0 5px var(--paper2),inset 0 0 0 6px rgba(20,20,20,.55),1px 3px 6px rgba(0,0,0,.35);color:#16181b}
.slip b{writing-mode:vertical-rl;font:900 58px/1 var(--ft);letter-spacing:.14em}
.slip i{writing-mode:vertical-rl;font:400 15px/1 var(--fb);font-style:normal;color:#5b574a;letter-spacing:.2em;padding-top:4px}
.cover .vol{position:absolute;left:46px;bottom:40px;writing-mode:vertical-rl;color:rgba(255,255,255,.82);font-size:17px;letter-spacing:.3em}
.cover .open{position:absolute;left:46px;bottom:150px;writing-mode:vertical-rl;color:rgba(255,255,255,.0);font:700 18px var(--ft);letter-spacing:.3em;transition:color .25s}
.cover:hover .open{color:rgba(255,255,255,.9)}

/* ---- 册签：每个单元一张，挂在封面下方 ---- */
.vols{list-style:none;margin:30px 0 0 8px;padding:0;display:flex;flex-direction:row-reverse;justify-content:center;gap:10px}
.vols a{display:block;writing-mode:vertical-rl;background:var(--paper2);border-top:4px solid var(--cv);padding:9px 8px 12px;min-height:150px;font:400 17px/1.15 var(--ft);letter-spacing:.12em;
  box-shadow:0 2px 0 rgba(0,0,0,.08),0 8px 14px -8px rgba(40,30,10,.45);transition:transform .18s}
.b1 .vols a{--cv:var(--c1)} .b2 .vols a{--cv:var(--c2)}
.vols a:hover{transform:translateY(-5px);color:var(--seal)}
.vols em{font-style:normal;color:var(--seal);font-size:15px;margin-bottom:6px}
.vols small{font:400 12px var(--fb);color:var(--mute);letter-spacing:.1em;margin-top:6px}

.cap{margin:22px 0 0 8px;text-align:center;font:400 16px var(--fb);color:var(--mute)}
.cap a{color:var(--ink);font:700 17px var(--ft);border-bottom:2px solid var(--seal);padding-bottom:1px}

/* ---- 试一试 ---- */
.tw{position:fixed;right:18px;bottom:16px;z-index:9;background:rgba(246,241,226,.96);border:1px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 12px;font:13px var(--sans);display:grid;gap:6px;border-radius:3px}
.tw div{display:flex;gap:0;align-items:center}
.tw span{color:var(--mute);margin-right:8px;min-width:2.2em}
.tw button{font:13px var(--sans);border:1px solid var(--ink);background:none;padding:3px 10px;margin-right:-1px;cursor:pointer;color:var(--ink)}
.tw button.on{background:var(--ink);color:var(--paper2)}
@media (max-width:860px){
  .top{padding:16px 16px 0}.top h1{font-size:30px}.top .go{margin-left:0}
  .desk{gap:44px;padding:26px 14px 120px}
  .book{width:min(372px,88vw)}
  .cover{height:min(528px,126vw)}
  .slip{left:6%;width:96px}
}
@media (prefers-reduced-motion:reduce){.cover,.vols a{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="seal" href="../../index.html" aria-label="文言自学 首页">文言<br>自学</a>
  <div><h1>文言自学</h1><p>IGCSE 0509 中文第一语言 · 文言文阅读自学</p></div>
  <a class="go" href="../../index.html#/j4/huxinting/read">继续上次 →<small>湖心亭看雪 · 读原文</small></a>
</header>
<main class="desk" id="desk"></main>

<div class="tw" role="group" aria-label="试一试">
  <div><span>配色</span><button data-theme="indigo" class="on">古籍蓝</button><button data-theme="current">现有红黑</button></div>
  <div><span>字体</span><button data-font="kai" class="on">全楷体</button><button data-font="mix">宋体标题</button></div>
</div>

<script src="../../data/jx1.js"></script><script src="../../data/jx2.js"></script><script src="../../data/jx3.js"></script><script src="../../data/jx4.js"></script><script src="../../data/jx5.js"></script>
<script src="../../data/unit1.js"></script><script src="../../data/unit2.js"></script><script src="../../data/unit3.js"></script><script src="../../data/unit4.js"></script><script src="../../data/unit5.js"></script>
<script>
const NUM = "一二三四五六七八九十", cn = n => n <= 10 ? NUM[n - 1] : n < 20 ? "十" + NUM[n - 11] : NUM[Math.floor(n / 10) - 1] + "十" + (n % 10 ? NUM[n % 10 - 1] : ""), H = p => "../../index.html#/" + p;
const BOOKS = [
  { id: "jiangxin", name: "匠心", tag: "课堂教材", units: window.JIANGXIN_UNITS || [] },
  { id: "caiwen", name: "采文", tag: "自学拓展", units: window.CAIWEN_UNITS || [] }
];
// 四眼线：孔与线（订口在右，所以线在封面右侧）
const stitch = `<svg class="stitch" viewBox="0 0 44 528" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke-linecap="round">
    <g stroke="rgba(0,0,0,.38)" stroke-width="5" transform="translate(1.2 1.6)"><path d="M17 62V466M17 62H41M17 198H41M17 330H41M17 466H41"/></g>
    <g stroke="var(--thread)" stroke-width="3.2"><path d="M17 62V466M17 62H41M17 198H41M17 330H41M17 466H41"/></g>
    <path d="M17 62V466" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="1 4"/>
  </g>
  <g>${[62, 198, 330, 466].map(y => `<circle cx="17" cy="${y}" r="5.2" fill="#0a0f17" opacity=".7"/><circle cx="17" cy="${y}" r="2.4" fill="var(--thread)"/>`).join("")}</g></svg>`;
document.getElementById("desk").innerHTML = BOOKS.map((b, i) => {
  const n = b.units.reduce((s, u) => s + u.texts.length, 0);
  return `<section class="book b${i + 1}">
    <a class="cover" href="${H("b/" + b.id)}" aria-label="进入《${b.name}》">
      ${stitch}<span class="corner t"></span><span class="corner b"></span>
      <span class="slip"><b>${b.name}</b><i>${b.tag}</i></span>
      <span class="open">翻开此书</span>
      <span class="vol">共${cn(b.units.length)}册　${cn(n)}篇</span>
    </a>
    <ol class="vols">${b.units.map((u, k) => `<li><a href="${H(u.id)}" title="${u.texts.map(t => t.title.replace(/（.*?）/g, "")).join("、")}"><em>${NUM[k]}</em>${u.title}<small>${cn(u.texts.length)}篇</small></a></li>`).join("")}</ol>
    <p class="cap"><a href="${H("b/" + b.id)}">翻开《${b.name}》全书</a></p>
  </section>`;
}).join("");
document.querySelectorAll(".tw button").forEach(btn => btn.onclick = () => {
  const k = btn.dataset.theme ? "theme" : "font", v = btn.dataset[k];
  document.documentElement.dataset[k] = v;
  document.querySelectorAll(".tw button[data-" + k + "]").forEach(x => x.classList.toggle("on", x === btn));
});
</script>
</body>
</html>
